name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.7.15
          uv sync --locked --extra dev
          npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Verify source inventory
        run: python scripts/source_manifest.py --check
      - name: Frontend tests
        run: npm --prefix frontend test -- --maxWorkers=2
      - name: Backend tests (external integrations skip without configuration)
        run: uv run --locked --extra dev python scripts/test_backend.py backend/tests -q
