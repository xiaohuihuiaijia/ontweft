name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.7.15
          uv sync --locked --extra dev --extra integrations --extra knowledge
          npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Verify source inventory
        run: python scripts/source_manifest.py --check
      - name: Frontend tests
        run: npm --prefix frontend test -- --maxWorkers=2
      - name: Backend tests (external integrations skip without configuration)
        run: uv run --locked --extra dev --extra integrations --extra knowledge python scripts/test_backend.py backend/tests -q
  linux-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-admin-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONTOLOGY_TEST_ADMIN_URL: postgresql+pg8000://postgres:synthetic-ci-admin-password@127.0.0.1:5432/postgres
      ONTOLOGY_TEST_RUNTIME_URL: postgresql+pg8000://ontology_runtime:synthetic-ci-runtime-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify the core-only installation
        run: |
          python -m pip install uv==0.7.15
          uv sync --locked --no-dev
          .venv/bin/python scripts/core_smoke.py
      - name: Install test extras and restricted database role
        env:
          PGPASSWORD: synthetic-ci-admin-password
        run: |
          uv sync --locked --extra dev --extra integrations --extra knowledge
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE ontology_runtime LOGIN PASSWORD 'synthetic-ci-runtime-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
      - name: PostgreSQL migrations, isolation and core regressions
        run: .venv/bin/python scripts/test_backend.py --postgres backend/tests -q
      - name: Dependency and source-license evidence
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
          uv export --locked --no-dev --no-hashes --no-emit-project > /tmp/ontweft-core-requirements.txt
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r /tmp/ontweft-core-requirements.txt
          python scripts/source_manifest.py --check
          test -s LICENSE && test -s NOTICE && test -s frontend/public/THIRD_PARTY_NOTICES.txt
