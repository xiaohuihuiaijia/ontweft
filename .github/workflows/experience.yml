name: Experience image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build linux/amd64 experience
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          docker build --target demo --platform linux/amd64 \
            --build-arg VERSION="${REF_NAME#v}" --build-arg REVISION="$COMMIT" \
            -t ontweft-experience:ci .
      - name: Verify clean start, worker, editing, history and restart
        run: python scripts/verify_experience_container.py --image ontweft-experience:ci
      - name: Publish verified version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:${REF_NAME#v}-demo"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag ontweft-experience:ci "$IMAGE"
          docker push "$IMAGE"
          docker logout ghcr.io
